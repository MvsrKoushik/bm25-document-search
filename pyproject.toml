[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm25-document-search"
version = "1.0.0"
description = "Dependency-free BM25 document index and search engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bm25-search = "document_search.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

